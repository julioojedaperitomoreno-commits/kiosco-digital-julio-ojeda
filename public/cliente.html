<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Álbum · Julio Ojeda</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f9;color:#173b5d}.wrap{max-width:1000px;margin:auto;padding:14px}.head,.panel{background:#fff;border:1px solid #e4edf2;border-radius:16px;padding:16px;margin-bottom:12px}.head{box-shadow:0 4px 15px #143c5a12}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}.foto{position:relative;background:#dfe7eb;border-radius:10px;overflow:hidden;aspect-ratio:1/1}.foto img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}.marca{position:absolute;left:5px;bottom:5px;color:#fff;background:#173b5dcc;padding:3px 5px;border-radius:4px;font-size:9px;font-weight:800}.precio{position:absolute;right:5px;bottom:5px;background:#fff;padding:4px 6px;border-radius:5px;font-size:11px;font-weight:800}.heart{position:absolute;right:5px;top:5px;background:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:20px;color:#d22;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;background:#1677a8;color:#fff}.viewer{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.viewer img{max-width:95vw;max-height:82vh}.close{position:absolute;right:20px;top:10px;color:#fff;font-size:38px;cursor:pointer}.fav{position:absolute;bottom:20px;background:#fff;border:0;border-radius:10px;padding:12px;font-weight:800}.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5ebef}.empty{text-align:center;padding:30px;color:#75838b}</style></head><body><main class="wrap"><header class="head"><b>📷 JULIO OJEDA FOTOGRAFÍA</b><div id="titulo" style="margin-top:8px;font-size:22px;font-weight:800">Cargando álbum...</div><div id="datos" class="empty" style="padding:8px 0"></div><div class="actions"><button class="btn" onclick="location.href='/'">← VOLVER A LA PORTADA</button><button class="btn" onclick="mostrarFav()">❤️ MIS FAVORITAS (<span id="count">0</span>)</button><button class="btn" onclick="compra()">🛒 COMPRAR SELECCIONADAS</button></div></header><section id="galeria" class="panel"><div id="grid" class="grid"></div></section><section id="compra" class="panel" style="display:none"><h2>🛒 Mis fotos seleccionadas</h2><div id="detalle"></div><div class="line"><b>Total</b><b id="total">$ 0</b></div><input id="emailCompra" type="email" placeholder="Tu email para recibir la descarga" style="width:100%;padding:12px;border:1px solid #d8e2e8;border-radius:9px;margin-top:12px;font-size:15px"><button class="btn" style="margin-top:12px" onclick="pagar()">💙 PAGAR CON MERCADO PAGO</button><div id="pagoEstado" style="margin-top:10px"></div><button class="btn" style="margin-top:12px" onclick="volverAlbum()">← VOLVER AL ÁLBUM</button></section></main><div id="viewer" class="viewer"><div class="close" onclick="cerrar()">×</div><img id="big"><button class="fav" onclick="toggleActual()">♡ AGREGAR A FAVORITAS</button></div><script>const id=new URLSearchParams(location.search).get('evento');let fotos=[],fav=new Set(),actual=null,precio=0;async function cargar(){if(!id){document.getElementById('titulo').textContent='Falta seleccionar un evento';return}const r=await fetch('/api/eventos/'+encodeURIComponent(id));const d=await r.json();if(!r.ok){document.getElementById('titulo').textContent=d.error;return}document.getElementById('titulo').textContent=d.evento.nombre;document.getElementById('datos').textContent=d.evento.lugar+' · '+d.evento.fecha+' · '+d.fotos.length+' fotografías';fotos=d.fotos;precio=Number(d.evento.precio||0);render()}function render(lista=fotos){const g=document.getElementById('grid');g.innerHTML=lista.length?lista.map((f,i)=>`<div class="foto"><img src="${f.url}" onclick="ver(${i})"><div class="marca">JULIO OJEDA<br>FOTOGRAFÍA</div><div class="precio">$ ${Number(precio).toLocaleString('es-AR')}</div><button class="heart" onclick="event.stopPropagation();toggle(${i})">${fav.has(i)?'♥':'♡'}</button></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Este álbum no tiene fotografías.</div>';document.getElementById('count').textContent=fav.size}function toggle(i){fav.has(i)?fav.delete(i):fav.add(i);render()}function mostrarFav(){const a=[...fav].map(i=>fotos[i]);render(a);document.getElementById('galeria').scrollIntoView()}function ver(i){actual=i;document.getElementById('big').src=fotos[i].url;document.getElementById('viewer').style.display='flex'}function cerrar(){document.getElementById('viewer').style.display='none'}function toggleActual(){toggle(actual)}function compra(){const d=document.getElementById('detalle');d.innerHTML='';[...fav].forEach(i=>{d.innerHTML+=`<div class="line"><span>📸 ${fotos[i].nombre}</span><span>$ ${Number(precio).toLocaleString('es-AR')}</span></div>`});document.getElementById('total').textContent='$ '+(fav.size*Number(precio)).toLocaleString('es-AR');document.getElementById('galeria').style.display='none';document.getElementById('compra').style.display='block'}async function pagar(){
 const email=document.getElementById('emailCompra').value.trim();
 if(!email){document.getElementById('pagoEstado').textContent='Ingresá tu email para continuar.';return}
 if(!fav.size){document.getElementById('pagoEstado').textContent='Seleccioná al menos una fotografía.';return}
 document.getElementById('pagoEstado').textContent='Preparando el pago...';
 try{
  const fotoIds=[...fav].map(i=>fotos[i].id);
  const r=await fetch('/api/pedidos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventoId:id,fotoIds,email})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'No se pudo preparar el pago');
  if(d.init_point){location.href=d.init_point;return}
  document.getElementById('pagoEstado').textContent='El pedido fue creado. Falta configurar Mercado Pago en el servidor.';
 }catch(e){document.getElementById('pagoEstado').textContent=e.message}
}
function volverAlbum(){document.getElementById('compra').style.display='none';document.getElementById('galeria').style.display='block'}cargar();</script></body></html>
