<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Kiosco Digital</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f9;color:#173b5d}.wrap{max-width:1000px;margin:auto;padding:18px}.head{background:#173b5d;color:#fff;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.panel{background:#fff;border:1px solid #e4edf2;border-radius:16px;padding:18px;box-shadow:0 4px 14px #143c5a12;margin-bottom:16px}label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}input,textarea{width:100%;padding:11px;border:1px solid #ccd9e0;border-radius:9px;font:inherit}textarea{min-height:80px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;margin:5px 4px 0 0}.primary{background:#1677a8;color:#fff}.green{background:#159447;color:#fff}.red{background:#c94b4b;color:#fff}.muted{color:#75838b;font-size:13px}.status{padding:10px;background:#eef6fa;border-radius:9px;margin-top:12px;font-size:13px}.event{border:1px solid #e1e9ee;border-radius:12px;padding:13px;margin-top:10px}.state{float:right;font-size:12px;font-weight:800}.pub{color:#159447}.draft{color:#a47b00}.files{margin-top:12px;font-size:13px}.file{padding:5px 0;border-bottom:1px solid #edf1f3}.back{color:#fff;text-decoration:none;font-size:13px}</style></head><body><header class="head"><div class="wrap"><b>📸 KIOSCO DIGITAL — ADMINISTRACIÓN</b><div style="margin-top:6px">Crear evento · cargar fotos · publicar</div><a class="back" href="/">← Volver a la portada</a></div></header><main class="wrap"><div class="grid"><section class="panel"><h2>1. Crear evento</h2><label>Nombre del evento</label><input id="nombre" placeholder="Ej.: Día de la Primavera 2026"><label>Fecha</label><input id="fecha" type="date"><label>Lugar</label><input id="lugar" placeholder="Ej.: Instituto San Martín de Tours"><label>Precio por foto</label><input id="precio" type="number" min="1" placeholder="3000"><label>Descripción</label><textarea id="descripcion"></textarea><button class="btn primary" onclick="crear()">CREAR EVENTO</button><button class="btn" onclick="limpiar()">LIMPIAR</button><div id="status" class="status">Sin evento seleccionado.</div></section><section class="panel"><h2>2. Cargar fotos</h2><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple onchange="seleccionar()"><div id="seleccion" class="status">0 fotos seleccionadas.</div><div id="lista" class="files"></div><button id="subir" class="btn green" onclick="subir()" disabled>SUBIR FOTOS</button><div id="upload" class="status">Creá un evento primero.</div><h2>3. Publicar</h2><button id="publicar" class="btn primary" onclick="publicar()" disabled>🟢 PUBLICAR EVENTO</button></section></div><section class="panel"><h2>Mis eventos</h2><div id="eventos">Cargando...</div></section></main><script>let actual=null,files=[];const $=id=>document.getElementById(id);async function api(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d}function seleccionar(){files=[...$('files').files];$('seleccion').textContent=files.length+' foto'+(files.length===1?'':'s')+' seleccionada'+(files.length===1?'':'s')+'.';$('lista').innerHTML=files.map(f=>`<div class="file">${esc(f.name)} · ${Math.round(f.size/1024)} KB</div>`).join('');$('subir').disabled=!actual||!files.length}async function crear(){try{const d=await api('/api/admin/eventos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:$('nombre').value,fecha:$('fecha').value,lugar:$('lugar').value,precio:$('precio').value,descripcion:$('descripcion').value})});actual=d.evento;$('status').textContent='Evento creado y seleccionado: '+actual.nombre;$('subir').disabled=!files.length;$('publicar').disabled=true;cargar()}catch(e){$('status').textContent=e.message}}async function crearPreview(file){return new Promise((resolve,reject)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{try{const max=1400,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);x.save();x.globalAlpha=.38;x.fillStyle='#fff';x.font='bold '+Math.max(24,Math.round(c.width/28))+'px Arial';x.rotate(-Math.PI/6);for(let yy=-c.height;yy<c.height*2;yy+=120){for(let xx=-c.width;xx<c.width*2;xx+=420)x.fillText('JULIO OJEDA',xx,yy)}x.restore();c.toBlob(b=>{URL.revokeObjectURL(u);b?resolve(b):reject(new Error('No se pudo crear la miniatura'))},'image/jpeg',.82)}catch(e){URL.revokeObjectURL(u);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('No se pudo procesar la fotografía'))};img.src=u})}
async function subir(){if(!actual||!files.length)return;$('upload').textContent='Subiendo...';let n=0;for(const f of files){try{const r=await fetch('/api/admin/subir?eventoId='+encodeURIComponent(actual.id),{method:'POST',headers:{'Content-Type':f.type,'X-File-Name':encodeURIComponent(f.name)},body:f});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error de carga');const prev=await crearPreview(f);const pr=await fetch('/api/admin/subir-preview?fotoId='+encodeURIComponent(d.foto.id),{method:'POST',headers:{'Content-Type':'image/jpeg'},body:prev});const pd=await pr.json();if(!pr.ok)throw new Error(pd.error||'Error al guardar la miniatura');n++;$('upload').textContent='Subidas '+n+' de '+files.length+'.'}catch(e){$('upload').textContent='Se detuvo en '+f.name+': '+e.message;return}}$('publicar').disabled=false;files=[];$('files').value='';$('seleccion').textContent='Carga terminada.';cargar()}async function publicar(){try{await api('/api/admin/publicar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventoId:actual.id})});$('upload').textContent='Evento publicado correctamente.';cargar()}catch(e){$('upload').textContent=e.message}}async function alternar(id,pub){await api('/api/admin/'+(pub?'despublicar':'publicar'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventoId:id})});cargar()}async function eliminar(id){if(!confirm('¿Eliminar este evento y sus fotos?'))return;await api('/api/admin/eliminar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventoId:id})});if(actual&&actual.id===id)actual=null;cargar()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function cargar(){const a=await api('/api/admin/eventos');$('eventos').innerHTML=a.length?a.map(e=>`<div class="event"><span class="state ${e.publicado?'pub':'draft'}">${e.publicado?'🟢 PUBLICADO':'🟡 BORRADOR'}</span><b>${esc(e.nombre)}</b><div class="muted">${e.fecha} · ${esc(e.lugar)} · $ ${Number(e.precio).toLocaleString('es-AR')} · ${e.fotos} fotos</div><button class="btn ${e.publicado?'red':'green'}" onclick="alternar('${e.id}',${e.publicado})">${e.publicado?'DESPUBLICAR':'PUBLICAR'}</button><button class="btn red" onclick="eliminar('${e.id}')">ELIMINAR</button></div>`).join(''):'<div class="muted">Todavía no hay eventos.</div>'}function limpiar(){['nombre','fecha','lugar','precio','descripcion'].forEach(x=>$(x).value='');actual=null;files=[];$('files').value='';$('seleccion').textContent='0 fotos seleccionadas.';$('subir').disabled=true;$('publicar').disabled=true;$('status').textContent='Sin evento seleccionado.'}cargar();</script></body></html>
